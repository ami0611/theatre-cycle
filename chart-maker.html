<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>Family Passion Chart - Final</title>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;700&display=swap" rel="stylesheet">
    <style>
        /* レイアウト */
        body { font-family: 'Noto Sans JP', sans-serif; background: #f0f2f5; margin: 0; display: flex; height: 100vh; }
        .editor { width: 350px; background: white; padding: 20px; overflow-y: auto; border-right: 1px solid #ddd; flex-shrink: 0; }
        .preview { flex-grow: 1; padding: 20px; overflow-y: auto; background: #525659; display: flex; justify-content: center; }
        
        /* フォーム */
        label { display: block; font-size: 11px; font-weight: bold; color: #666; margin-top: 10px; }
        input { width: 100%; padding: 8px; margin-top: 4px; border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box; font-size: 13px; }
        .btn { background: #ff6b6b; color: white; border: none; padding: 15px; width: 100%; border-radius: 5px; cursor: pointer; font-weight: bold; margin-top: 20px; }

        /* A4シート */
        #chart { width: 210mm; min-height: 297mm; padding: 15mm; background: white; box-sizing: border-box; display: flex; flex-direction: column; }
        .header { text-align: center; border: 3px solid #333; padding: 15px; margin-bottom: 15px; border-radius: 10px; }
        .section-title { background: #333; color: white; padding: 3px 10px; font-size: 12px; font-weight: bold; margin-bottom: 8px; display: inline-block; }
        
        table { width: 100%; border-collapse: collapse; margin-bottom: 15px; }
        th, td { border: 2.5px solid #333; padding: 8px; font-size: 11px; text-align: left; }
        .tracker td { text-align: center; height: 35px; }
        
        .flex-row { display: grid; grid-template-columns: 1.3fr 1fr; gap: 20px; margin-bottom: 15px; }
        .summary { background: #f0f9ff; border: 2.5px solid #0077cc; padding: 15px; border-radius: 10px; display: flex; justify-content: space-around; text-align: center; }
        .val { font-size: 22px; font-weight: bold; color: #0077cc; }
        .blank { display: none; font-size: 20px; font-weight: bold; }

        .footer { margin-top: auto; border-top: 3px solid #333; padding-top: 20px; }
        .box-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; margin-bottom: 15px; }
        .box { border: 2.5px solid #333; height: 110px; border-radius: 8px; position: relative; }
        .box-l { position: absolute; top: -12px; left: 10px; background: white; padding: 0 5px; font-weight: bold; font-size: 12px; }

        /* 印刷設定 */
        @media print {
            .editor { display: none !important; }
            .preview { background: white !important; padding: 0 !important; }
            #chart { border: none !important; box-shadow: none !important; margin: 0 !important; width: 210mm; height: 297mm; }
            .val { display: none !important; }
            .blank { display: inline-block !important; }
            .summary { border-color: #333 !important; background: white !important; }
            input[type="checkbox"] { appearance: none; -webkit-appearance: none; border: 2px solid #333; width: 18px; height: 18px; background: white; }
        }
    </style>
</head>
<body>

<div class="editor">
    <h2 style="font-size:16px; color:#ff6b6b; margin-top:0;">🛠 Chart Editor</h2>
    <label>名前 / カラー</label>
    <div style="display:flex; gap:5px;"><input type="text" id="in-n" value="Emma"><input type="color" id="in-c" value="#ffeaa7"></div>
    
    <label>💰 内容 / 単価 / ボーナス時間</label>
    <div style="display:flex; gap:2px;"><input type="text" id="in-a1" value="英語の発音練習"><input type="text" id="in-p1" value="80" style="width:55px;"><input type="text" id="in-b1" value="15" style="width:55px;"></div>
    <div style="display:flex; gap:2px;"><input type="text" id="in-a2" value="算数の練習"><input type="text" id="in-p2" value="80" style="width:55px;"><input type="text" id="in-b2" value="0" style="width:55px;"></div>
    <div style="display:flex; gap:2px;"><input type="text" id="in-a3" value="漢字の復習"><input type="text" id="in-p3" value="80" style="width:55px;"><input type="text" id="in-b3" value="0" style="width:55px;"></div>
    <div style="display:flex; gap:2px;"><input type="text" id="in-a4" value="セリフ練習"><input type="text" id="in-p4" value="160" style="width:55px;"><input type="text" id="in-b4" value="10" style="width:55px;"></div>
    
    <label>📱 平日 / 週末 制限時間</label>
    <div style="display:flex; gap:5px;"><input type="text" id="in-wd" value="45 min"><input type="text" id="in-we" value="60 min"></div>
    
    <label>🌟 聖域・応援メッセージ</label>
    <input type="text" id="in-msg" value="Rehearsal is ALWAYS protected time! ✨">
    
    <label>🌈 振り返り / ✉️ メッセージ タイトル</label>
    <div style="display:flex; gap:5px;"><input type="text" id="in-rt" value="Weekly Reflection"><input type="text" id="in-mt" value="Message from Mom"></div>
    
    <button class="btn" onclick="window.print()">🖨 印刷（空欄で出力されます）</button>
</div>

<div class="preview">
    <div id="chart">
        <div class="header" id="out-h" style="background-color: #ffeaa7;">
            <h1 style="margin:0; font-size:24px;"><span id="out-n">Emma</span>'s Weekly Chart</h1>
        </div>

        <div class="flex-row">
            <div>
                <span class="section-title">💰 My Allowance Settings</span>
                <table>
                    <tr><th>Activity</th><th>Price</th><th>Bonus</th></tr>
                    <tr><td id="out-a1"></td><td>¥<span id="out-p1"></span></td><td>+<span id="out-b1"></span>m</td></tr>
                    <tr><td id="out-a2"></td><td>¥<span id="out-p2"></span></td><td>+<span id="out-b2"></span>m</td></tr>
                    <tr><td id="out-a3"></td><td>¥<span id="out-p3"></span></td><td>+<span id="out-b3"></span>m</td></tr>
                    <tr><td id="out-a4"></td><td>¥<span id="out-p4"></span></td><td>+<span id="out-b4"></span>m</td></tr>
                </table>
            </div>
            <div>
                <span class="section-title">📱 Screen Time Rules</span>
                <table><tr><th>Weekday</th><th>Weekend</th></tr><tr><td id="out-wd" style="text-align:center; font-weight:bold;"></td><td id="out-we" style="text-align:center; font-weight:bold;"></td></tr></table>
                <div style="font-size:10px; background:#fff9e6; border:2.5px solid #333; padding:8px; font-weight:bold;"><span id="out-msg"></span></div>
            </div>
        </div>

        <span class="section-title">✅ Weekly Activity Tracker</span>
        <table class="tracker">
            <tr><th style="width:30%;">Activity</th><th>M</th><th>T</th><th>W</th><th>T</th><th>F</th><th>S</th><th>S</th></tr>
            <tr><td id="out-t1"></td><td><input type="checkbox" class="ck" data-i="1"></td><td><input type="checkbox" class="ck" data-i="1"></td><td><input type="checkbox" class="ck" data-i="1"></td><td><input type="checkbox" class="ck" data-i="1"></td><td><input type="checkbox" class="ck" data-i="1"></td><td><input type="checkbox" class="ck" data-i="1"></td><td><input type="checkbox" class="ck" data-i="1"></td></tr>
            <tr><td id="out-t2"></td><td><input type="checkbox" class="ck" data-i="2"></td><td><input type="checkbox" class="ck" data-i="2"></td><td><input type="checkbox" class="ck" data-i="2"></td><td><input type="checkbox" class="ck" data-i="2"></td><td><input type="checkbox" class="ck" data-i="2"></td><td><input type="checkbox" class="ck" data-i="2"></td><td><input type="checkbox" class="ck" data-i="2"></td></tr>
            <tr><td id="out-t3"></td><td><input type="checkbox" class="ck" data-i="3"></td><td><input type="checkbox" class="ck" data-i="3"></td><td><input type="checkbox" class="ck" data-i="3"></td><td><input type="checkbox" class="ck" data-i="3"></td><td><input type="checkbox" class="ck" data-i="3"></td><td><input type="checkbox" class="ck" data-i="3"></td><td><input type="checkbox" class="ck" data-i="3"></td></tr>
            <tr><td id="out-t4"></td><td><input type="checkbox" class="ck" data-i="4"></td><td><input type="checkbox" class="ck" data-i="4"></td><td><input type="checkbox" class="ck" data-i="4"></td><td><input type="checkbox" class="ck" data-i="4"></td><td><input type="checkbox" class="ck" data-i="4"></td><td><input type="checkbox" class="ck" data-i="4"></td><td><input type="checkbox" class="ck" data-i="4"></td></tr>
        </table>

        <div class="summary">
            <div><span>Total Earned</span><br><span class="val">¥<span id="t-m">0</span></span><span class="blank">¥ _________</span></div>
            <div><span>Additional Time</span><br><span class="val">+<span id="t-t">0</span> min</span><span class="blank">+ _________ min</span></div>
        </div>

        <div class="footer">
            <div class="box-grid">
                <div class="box"><div class="box-l" id="out-rt"></div></div>
                <div class="box"><div class="box-l" id="out-mt"></div></div>
            </div>
            <div style="text-align:center; font-weight:bold; font-size:14px; margin-top:5px;">Keep going! Break a leg! ✨</div>
        </div>
    </div>
</div>

<script>
    const map = {
        'in-n':['out-n'],'in-a1':['out-a1','out-t1'],'in-a2':['out-a2','out-t2'],'in-a3':['out-a3','out-t3'],'in-a4':['out-a4','out-t4'],
        'in-p1':['out-p1'],'in-p2':['out-p2'],'in-p3':['out-p3'],'in-p4':['out-p4'],
        'in-b1':['out-b1'],'in-b2':['out-b2'],'in-b3':['out-b3'],'in-b4':['out-b4'],
        'in-wd':['out-wd'],'in-we':['out-we'],'in-msg':['out-msg'],'in-rt':['out-rt'],'in-mt':['out-mt']
    };

    function calc() {
        let m=0, t=0;
        for(let i=1; i<=4; i++) {
            const count = document.querySelectorAll('.ck[data-i="'+i+'"]:checked').length;
            m += count * (parseInt(document.getElementById('in-p'+i).value) || 0);
            t += count * (parseInt(document.getElementById('in-b'+i).value) || 0);
        }
        document.getElementById('t-m').innerText = m;
        document.getElementById('t-t').innerText = t;
    }

    Object.keys(map).forEach(function(id) {
        const input = document.getElementById(id);
        if(input) {
            const update = function() {
                map[id].forEach(function(oid) { document.getElementById(oid).innerText = input.value; });
                calc();
            };
            input.addEventListener('input', update);
            update();
        }
    });

    document.querySelectorAll('.ck').forEach(function(el) { el.addEventListener('change', calc); });
    document.getElementById('in-c').addEventListener('input', function(e) { document.getElementById('out-h').style.backgroundColor = e.target.value; });
</script>
</body>
</html>
