<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>Family Inspiration Chart Maker</title>
    <link href="https://fonts.googleapis.com/css2?family=Kiwi+Maru&family=Noto+Sans+JP:wght@400;700&family=Noto+Serif+JP:wght@600&display=swap" rel="stylesheet">
    <style>
        /* 画面表示用設定 */
        body { font-family: 'Noto Sans JP', sans-serif; background: #f4f7f6; padding: 20px; color: #333; }
        .controls { max-width: 900px; margin: 0 auto 30px; background: white; padding: 20px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); border: 2px solid #ff6b6b; }
        .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
        .input-group { margin-bottom: 15px; }
        label { display: block; font-weight: bold; margin-bottom: 4px; font-size: 11px; color: #555; }
        input, select { width: 100%; padding: 8px; border: 1px solid #ddd; border-radius: 6px; box-sizing: border-box; font-size: 13px; }
        
        .print-btn { background: #ff6b6b; color: white; border: none; padding: 18px; border-radius: 8px; cursor: pointer; font-size: 20px; width: 100%; font-weight: bold; margin-top: 10px; box-shadow: 0 4px 0 #ee5253; }
        .print-btn:hover { background: #ee5253; }

        /* A4チャート（プレビュー・印刷用） */
        #printable-chart { 
            width: 210mm; min-height: 297mm; padding: 12mm; margin: 0 auto;
            background: white; box-sizing: border-box; border: 1px solid #333;
            display: flex; flex-direction: column;
        }
        .header { text-align: center; border: 2.5px solid #333; padding: 12px; margin-bottom: 15px; border-radius: 10px; }
        .section-title { background: #333; color: white; padding: 3px 10px; display: inline-block; margin-bottom: 8px; font-size: 12px; font-weight: bold; }
        
        table { width: 100%; border-collapse: collapse; margin-bottom: 12px; }
        th, td { border: 2px solid #333; padding: 6px 8px; text-align: left; font-size: 11px; }
        .tracker td { text-align: center; font-size: 18px; height: 35px; }

        .flex-row { display: grid; grid-template-columns: 1.3fr 1fr; gap: 20px; margin-bottom: 15px; }
        
        /* 振り返り・メッセージセクション */
        .footer-section { margin-top: auto; border-top: 2px solid #333; padding-top: 20px; }
        .box-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-bottom: 20px; }
        .reflect-box { border: 2px solid #333; height: 120px; border-radius: 8px; position: relative; padding: 15px; }
        .box-label { position: absolute; top: -12px; left: 15px; background: white; padding: 0 8px; font-weight: bold; font-size: 12px; }

        .quote-style { text-align: center; font-style: italic; border-top: 1px dashed #ccc; padding-top: 15px; color: #555; font-size: 11px; min-height: 30px; }

        @media print {
            body { background: none; padding: 0; }
            .controls { display: none; }
            #printable-chart { border: none; margin: 0; width: 210mm; height: 297mm; }
        }
    </style>
</head>
<body>

<div class="controls">
    <h2 style="margin:0 0 15px; font-size:18px; color:#ff6b6b;">🛠 Chart Editor</h2>
    
    <div class="grid input-group">
        <div><label>名前 / 絵文字 / 色</label>
            <div style="display:flex; gap:3px;"><input type="text" id="in-name" value="Emma"><input type="text" id="in-emoji" value="❄️" style="width:40px;"><input type="color" id="in-color" value="#ffeaa7" style="width:50px;"></div>
        </div>
        <div><label>書体選択</label><select id="in-font"><option value="'Noto Sans JP'">Standard</option><option value="'Kiwi Maru'">Cute</option><option value="'Noto Serif JP'">Classic</option></select></div>
    </div>

    <div class="input-group"><label>今週の目標 (Goal)</label><input type="text" id="in-goal" value="Musical Theater (Anna - Frozen!)"></div>

    <div class="grid">
        <div class="input-group"><label>💰 アクティビティ</label>
            <input type="text" id="in-a1" value="英語の発音練習" style="margin-bottom:3px;"><input type="text" id="in-a2" value="学校以外の算数" style="margin-bottom:3px;"><input type="text" id="in-a3" value="漢字の復習" style="margin-bottom:3px;"><input type="text" id="in-a4" value="セリフや歌の練習">
        </div>
        <div><label>📱 ルール & 聖域</label>
            <div style="display:flex; gap:3px; margin-bottom:5px;"><input type="text" id="in-wd" value="45m"><input type="text" id="in-we" value="60m"></div>
            <input type="text" id="in-msg" value="Rehearsal is ALWAYS protected time! ✨">
        </div>
    </div>

    <div class="grid input-group">
        <div><label>左枠タイトル (振り返り)</label><input type="text" id="in-re-t" value="🌈 Weekly Reflection"></div>
        <div><label>右枠タイトル (メッセージ)</label><input type="text" id="in-me-t" value="✉️ Message from Family"></div>
    </div>

    <button class="print-btn" onclick="updateQuoteAndPrint()">🖨 名言を添えて印刷する</button>
</div>

<div id="printable-chart">
    <div class="header" id="out-header" style="background-color: #ffeaa7;">
        <h1 style="margin:0; font-size:24px;"><span id="out-emoji">❄️</span> <span id="out-name">Emma</span>'s Weekly Chart</h1>
        <p id="out-goal" style="margin:5px 0 0; font-weight:bold; font-size:15px;">Musical Theater (Anna - Frozen!)</p>
    </div>

    <div class="flex-row">
        <div><span class="section-title">💰 Allowance</span>
            <table>
                <tr><td id="out-a1">英語の発音練習</td><td>¥80</td></tr><tr><td id="out-a2">学校以外の算数</td><td>¥80</td></tr><tr><td id="out-a3">漢字の復習</td><td>¥80</td></tr><tr><td id="out-a4">セリフや歌の練習</td><td>¥160</td></tr>
            </table>
        </div>
        <div><span class="section-title">📱 Screen Time</span>
            <table><tr><td>WD / WE</td><td><span id="out-wd">45m</span> / <span id="out-we">60m</span></td></tr></table>
            <div style="font-size:10px; background:#fff9e6; padding:8px; border:1.5px solid #333; margin-top:5px;">
                <strong>Sanctuary:</strong> <span id="out-msg">Rehearsal is ALWAYS protected time! ✨</span>
            </div>
        </div>
