<!DOCTYPE html>

<head>

    <link href="https://fonts.googleapis.com/css2?family=Kiwi+Maru&family=Noto+Sans+JP:wght@400;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Noto Sans JP', sans-serif; background: #f0f2f5; margin: 0; display: flex; height: 100vh; }
        .editor { width: 360px; background: white; padding: 20px; overflow-y: auto; border-right: 2px solid #ddd; flex-shrink: 0; }
        .preview { flex-grow: 1; padding: 20px; overflow-y: auto; background: #525659; display: flex; justify-content: center; }
        input, select { width: 100%; padding: 8px; margin-bottom: 8px; border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box; font-size: 13px; }
        label { font-size: 11px; font-weight: bold; color: #666; margin-top: 10px; display: block; }
        .btn { background: #ff6b6b; color: white; border: none; padding: 15px; width: 100%; border-radius: 5px; cursor: pointer; font-weight: bold; margin-top: 10px; }

        #chart { width: 210mm; min-height: 297mm; padding: 12mm; background: white; box-sizing: border-box; display: flex; flex-direction: column; }
        .header { text-align: center; border: 3px solid #333; padding: 15px; margin-bottom: 15px; border-radius: 10px; }
        .section-title { background: #333; color: white; padding: 3px 10px; font-size: 12px; font-weight: bold; margin-bottom: 8px; display: inline-block; }
        table { width: 100%; border-collapse: collapse; margin-bottom: 15px; }
        th, td { border: 2.5px solid #333; padding: 8px; font-size: 11px; text-align: left; }
        .tracker td { text-align: center; height: 35px; }
        .tracker input[type="checkbox"] { transform: scale(1.4); cursor: pointer; }
        .flex-row { display: grid; grid-template-columns: 1.3fr 1fr; gap: 20px; margin-bottom: 15px; }
        .sanctuary-box { background: #fff9e6; border: 2px solid #333; padding: 10px; font-size: 11px; margin-top: 5px; }

        /* 合計エリア：画面では数字、印刷では下線 */
        .summary { background: #f0f9ff; border: 2.5px solid #0077cc; padding: 15px; border-radius: 10px; margin-top: 10px; display: flex; justify-content: space-around; text-align: center; }
        .val-text { font-size: 22px; font-weight: bold; color: #0077cc; }
        .blank-text { display: none; font-size: 20px; font-weight: bold; }

        .footer { margin-top: auto; border-top: 3px solid #333; padding-top: 15px; }
        .box-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; margin-bottom: 15px; }
        .reflect-box { border: 2px solid #333; height: 120px; border-radius: 8px; position: relative; padding: 10px; }
        .box-l { position: absolute; top: -12px; left: 10px; background: white; padding: 0 8px; font-weight: bold; font-size: 12px; }

        @media print {
            .editor { display: none !important; }
            .preview { background: white !important; padding: 0 !important; overflow: visible !important; }
            #chart { border: none !important; box-shadow: none !important; margin: 0 !important; }
            .tracker input[type="checkbox"] { appearance: none !important; -webkit-appearance: none !important; border: 2px solid #333 !important; width: 18px !important; height: 18px !important; background: white !important; }
            
            /* 印刷時は数字（val-text）を消して下線（blank-text）を強制表示 */
            .val-text { display: none !important; }
            .blank-text { display: inline-block !important; }
            .summary { border-color: #333 !important; background: white !important; }
        }
    </style>
</head>
