<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Designer Family Chart Maker</title>
    <link href="https://fonts.googleapis.com/css2?family=Kiwi+Maru&family=Noto+Sans+JP:wght@400;700&family=Noto+Serif+JP:wght@600&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Noto Sans JP', sans-serif; background: #f0f2f5; padding: 15px; color: #333; line-height: 1.3; }
        .controls { max-width: 950px; margin: 0 auto 20px; background: white; padding: 20px; border-radius: 12px; box-shadow: 0 4px 20px rgba(0,0,0,0.08); }
        .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
        .input-group { margin-bottom: 12px; border-bottom: 1px solid #eee; padding-bottom: 8px; }
        label { display: block; font-weight: bold; margin-bottom: 4px; font-size: 11px; color: #555; }
        input, select { width: 100%; padding: 8px; border: 1px solid #ddd; border-radius: 6px; box-sizing: border-box; font-size: 13px; }
        button { background: #ff6b6b; color: white; border: none; padding: 15px; border-radius: 8px; cursor: pointer; font-size: 18px; width: 100%; font-weight: bold; margin-top: 10px; }

        /* A4 Layout Base */
        #printable-chart { 
            width: 210mm; min-height: 297mm; padding: 10mm 12mm; margin: 0 auto;
            background: white; box-sizing: border-box; border: 1px solid #eee;
        }
        .chart-header { text-align: center; padding: 15px; margin-bottom: 15px; border-radius: 8px; }
        .section-title { background: #333; color: white; padding: 3px 10px; display: inline-block; margin-bottom: 8px; font-size: 13px; font-weight: bold; }
        
        table { width: 100%; border-collapse: collapse; margin-bottom: 12px; table-layout: fixed; }
        th, td { border: 1.5px solid #333; padding: 6px 8px; text-align: left; font-size: 12px; }
        .tracker-table td { text-align: center; font-size: 16px; height: 32px; }

        .rules-grid { display: grid; grid-template-columns: 1.3fr 1.1fr; gap: 15px; }
        .footer-area { margin-top: 15px; border-top: 2px solid #333; padding-top: 10px; display: grid; grid-template-columns: 1.5fr 1fr; gap: 15px; }
        .note-box { border: 2px dashed #333; padding: 10px; font-size: 11px; }

        @media print {
            body { background: none; padding: 0; }
            .controls { display: none; }
            #printable-chart { border: none; margin: 0; width: 210mm; }
        }

        /* Design Styles */
        .style-dot td, .style-dot th { border-style: dotted !important; }
        .style-double td, .style-double th { border-style: double !important; border-width: 4px !important; }
