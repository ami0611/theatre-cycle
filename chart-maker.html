<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Family Inspiration Chart Maker</title>
    <link href="https://fonts.googleapis.com/css2?family=Kiwi+Maru&family=Noto+Sans+JP:wght@400;700&family=Noto+Serif+JP:wght@600&display=swap" rel="stylesheet">
    <style>
        /* 画面表示用 */
        body { font-family: 'Noto Sans JP', sans-serif; background: #f4f7f6; padding: 20px; color: #333; }
        .controls { max-width: 900px; margin: 0 auto 30px; background: white; padding: 25px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); }
        .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; }
        .input-group { margin-bottom: 15px; border-bottom: 1px solid #eee; padding-bottom: 10px; }
        label { display: block; font-weight: bold; margin-bottom: 5px; font-size: 12px; color: #666; }
        input, select { width: 100%; padding: 10px; border: 1px solid #ddd; border-radius: 6px; box-sizing: border-box; }
        
        .print-btn { background: #ff6b6b; color: white; border: none; padding: 20px; border-radius: 8px; cursor: pointer; font-size: 20px; width: 100%; font-weight: bold; margin-top: 20px; box-shadow: 0 4px 0 #ee5253; }
        .print-btn:hover { background: #ee5253; }

        /* A4チャート（印刷対象） */
        #printable-chart { 
            width: 210mm; min-height: 297mm; padding: 12mm; margin: 0 auto;
            background: white; box-sizing: border-box; border: 1px solid #333;
            display: flex; flex-direction: column;
        }
        .chart-header { text-align: center; padding: 15px; margin-bottom: 20px; border: 3px solid #333; border-radius: 10px; }
        .section-title { background: #333; color: white; padding: 4px 12px; display: inline-block; margin-bottom: 10px; font-size: 13px; font-weight: bold; }
        
        table { width: 100%; border-collapse: collapse; margin-bottom: 15px; }
        th, td { border: 2px solid #333; padding: 8px; text-align: left; font-size: 12px; }
        .tracker-table td { text-align: center; font-size: 18px; height: 35px; }

        .rules-grid { display: grid; grid-template-columns: 1.3fr 1fr; gap: 20px; margin-bottom: 15px; }
        
        /* 振り返り・メッセージセクション */
        .reflection-area { margin-top: auto; padding-top: 20px; border-top: 2px solid #333; }
