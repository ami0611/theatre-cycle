<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Family Economy Chart Maker | Theatre Cycle</title>
    <style>
        body { font-family: 'Helvetica Neue', Arial, sans-serif; background: #f4f7f6; padding: 20px; color: #333; }
        .controls { max-width: 800px; margin: 0 auto 30px; background: white; padding: 25px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); }
        .input-group { margin-bottom: 20px; border-bottom: 1px dashed #ddd; padding-bottom: 15px; }
        .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; }
        label { display: block; font-weight: bold; margin-bottom: 8px; font-size: 14px; color: #555; }
        input { width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 6px; box-sizing: border-box; font-size: 14px; }
        input:focus { border-color: #ff6b6b; outline: none; box-shadow: 0 0 5px rgba(255,107,107,0.3); }
        button { background: #ff6b6b; color: white; border: none; padding: 18px; border-radius: 8px; cursor: pointer; font-size: 18px; width: 100%; margin-top: 10px; font-weight: bold; transition: 0.3s; }
        button:hover { background: #ee5253; transform: translateY(-2px); }

        /* A4印刷用 */
        #printable-chart { 
            width: 210mm; min-height: 297mm; padding: 15mm; margin: 0 auto;
            background: white; border: 1px solid #ddd; box-sizing: border-box;
        }
        .chart-header { text-align: center; border-bottom: 3px solid #333; padding: 20px; margin-bottom: 25px; border-radius: 8px 8px 0 0; }
        .chart-title { font-size: 32px; margin: 0; font-weight: 800; }
        
        table { width: 100%; border-collapse: collapse; margin-bottom: 25px; }
        th, td { border: 2px solid #333; padding: 12px; text-align: left; }
        th { background-color: rgba(0,0,0,0.03); font-weight: bold; }
        .tracker-table td { text-align: center; font-size: 22px; height: 45px; }

        .footer-note { margin-top: 35px; border-left: 8px solid #333; padding: 20px; background: #f9f9f9; border-radius: 0 8px 8px 0; }
        .footer-note p { margin: 5px 0; font-size: 15px; }

        @media print {
            body { background: none; padding: 0; }
            .controls { display: none; }
            #printable-chart { border: none; margin: 0; width: 100%; }
        }
    </style>
</head>
<body>

<div class="controls">
    <h2 style="margin-top:0;">🎨 Chart Personalization</h2>
    
    <div class="input-group grid">
        <div><label>お子さんの名前</label><input type="text" id="in-name" value="Emma"></div>
        <div><label>好きな絵文字</label><input type="text" id="in-emoji" value="❄️"></div>
    </div>

    <div class="input-group grid">
        <div><label>テーマカラー</label><input type="color" id="in-color" value="#ffeaa7"></div>
        <div><label>今週の目標・情熱</label><input type="text" id="in-goal" value="Musical Theater (Anna - Frozen!)"></div>
    </div>

    <div class="input-group">
        <label>💰 アクティビティと報酬額</label>
        <div class="grid" style="margin-bottom:8px;"><input type="text" id="in-act1" value="英語の発音練習"><input type="text" id="in-pr1" value="¥80"></div>
        <div class="grid" style="margin-bottom:8px;"><input type="text" id="in-act2" value="学校以外の算数"><input type="text" id="in-pr2" value="¥80"></div>
