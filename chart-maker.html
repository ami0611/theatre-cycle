<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>Family Passion Chart - Final</title>
    <link href="https://fonts.googleapis.com/css2?family=Kiwi+Maru&family=Noto+Sans+JP:wght@400;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Noto Sans JP', sans-serif; background: #f0f2f5; margin: 0; display: flex; height: 100vh; overflow: hidden; }
        .editor { width: 360px; background: white; padding: 20px; overflow-y: auto; border-right: 2px solid #ddd; }
        .preview { flex-grow: 1; padding: 20px; overflow-y: auto; background: #525659; display: flex; justify-content: center; }
        input, select { width: 100%; padding: 8px; margin-bottom: 8px; border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box; font-size: 13px; }
        label { font-size: 11px; font-weight: bold; color: #666; }
        .btn { background: #ff6b6b; color: white; border: none; padding: 15px; width: 100%; border-radius: 5px; cursor: pointer; font-weight: bold; margin-top: 10px; }
        
        #chart { width: 210mm; min-height: 297mm; padding: 12mm; background: white; box-sizing: border-box; display: flex; flex-direction: column; }
        .header { text-align: center; border: 3px solid #333; padding: 15px; margin-bottom: 15px; border-radius: 10px; }
        .section-title { background: #333; color: white; padding: 3px 10px; font-size: 12px; font-weight: bold; margin-bottom: 8px; display: inline-block; }
        table { width: 100%; border-collapse: collapse; margin-bottom: 15px; }
        th, td { border: 2px solid #333; padding: 8px; font-size: 11px; }
        .tracker td { text-align: center; height: 35px; }
        .tracker input[type="checkbox"] { transform: scale(1.4); }
        
        /* 合計金額エリア */
        .summary { background: #f0f9ff; border: 2px solid #0077cc; padding: 15px; border-radius: 10px; margin-top: 10px; display: flex; justify-content: space-around; text-align: center; }
        .val-text { font-size: 22px; font-weight: bold; color: #0077cc; }
        .blank-text { display: none; font-size: 20px; font-weight: bold; }

        .footer { margin-top: auto; border-top: 3px solid #333; padding-top: 15px; }
        .box-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; margin-bottom: 10px; }
        .box { border: 2px solid #333; height: 110px; border-radius: 8px; position: relative; }
        .box-l { position: absolute; top: -10px; left: 10px; background: white; padding: 0 5px; font-weight: bold; font-size: 11px; }
        
        /* 【最重要】印刷時の上書き設定 */
        @media print {
            .editor { display: none !important; }
            .preview { background: white !important; padding: 0 !important; }
            #chart { border: none !important; box-shadow: none !important; margin: 0 !important; }
            
            /* チェックボックスを真っ白な四角にする */
            .tracker input[type="checkbox"] { 
                appearance: none !important; -webkit-appearance: none !important; 
                border: 2px solid #333 !important; width: 18px !important; height: 18px !important; background: white !important; 
            }
            
            /* 画面上の「0」や計算結果を隠して、下線を出す */
            .val-text { display: none !important; }
            .blank-text { display: inline-block !important; }
            
            /* 青い背景を白に戻す */
            .summary { border-color: #333 !important; background: white !important; }
        }
    </style>
</head>
<body>

<div class="editor">
    <h2 style="font-size:16px; color:#ff6b6b; margin-top:0;">🛠 Final Editor</h2>
    <label>名前 / カラー</label>
    <div style="display:flex; gap:5px;"><input type="text" id="i-n" value="Emma"><input type="color" id="i-c" value="#ffeaa7"></div>
    <label>💰 内容 / 単価 / ボーナス時間</label>
    <div style="display:flex; gap:2px;"><input type="text" id="i-a1" value="英語の発音"><input type="text" id="i-p1" value="80" style="width:60px;"><input type="text" id="i-b1" value="15" style="width:60px;"></div>
    <div style="display:flex; gap:2px;"><input type="text" id="i-a2" value="算数の練習"><input type="text" id="i-p2" value="80" style="width:60px;"><input type="text" id="i-b2" value="0" style="width:60px;"></div>
    <div style="display:flex; gap:2px;"><input type="text" id="i-a3" value="漢字の復習"><input type="text" id="i-p3" value="80" style="width:60px;"><input type="text" id="i-b3" value="0" style="width:60px;"></div>
    <div style="display:flex; gap:2px;"><input type="text" id="i-a4" value="セリフ練習"><input type="text" id="i-p4" value="160" style="width:60px;"><input type="text" id="i-b4" value="10" style="width:60px;"></div>
    <label>📱 平日 / 週末 制限</label>
    <div style="display:flex; gap:5px;"><input type="text" id="i-wd" value="45 min"><input type="text" id="i-we" value="60 min"></div>
    <label>🌟 聖域・タイトル (左 / 右)</label>
    <input type="text" id="i-msg" value="Rehearsal is ALWAYS protected time! ✨">
    <div style="display:flex; gap:5px;"><input type="text" id="i-rt" value="Reflection"><input type="text" id="i-mt" value="Message"></div>
    <button class="btn" onclick="window.print()">🖨 印刷（空欄で出力されます）</button>
</div>

<div class="preview">
    <div id="chart">
        <div class="header" id="o-h" style="background-color: #ffeaa7;">
            <h1 style="margin:0; font-size:24px;"><span id="o-n">Emma</span>'s Weekly Chart</h1>
        </div>
        <div style="display:grid; grid-template-columns: 1.3fr 1fr; gap:15px; margin-bottom:15px;">
            <div><span class="section-title">💰 Allowance</span>
                <table><tr><th>Activity</th><th>Price</th><th>Bonus</th></tr>
                <tr><td id="o-a1"></td><td>¥<span id="o-p1"></span></td><td>+<span id="o-b1"></span>m</td></tr>
                <tr><td id="o-a2"></td><td>¥<span id="o-p2"></span></td><td>+<span id="o-b2"></span>m</td></tr>
                <tr><td id="o-a3"></td><td>¥<span id="o-p3"></span></td><td>+<span id="o-b3"></span>m</td></tr>
                <tr><td id="o-a4"></td><td>¥<span id="o-p4"></span></td><td>+<span id="o-b4"></span>m</td></tr></table>
            </div>
            <div><span class="section-title">📱 Screen Time Rules
