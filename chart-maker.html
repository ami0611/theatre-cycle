<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>Family Inspiration Chart Maker - Final Edition</title>
    <link href="https://fonts.googleapis.com/css2?family=Kiwi+Maru&family=Noto+Sans+JP:wght@400;700&family=Noto+Serif+JP:wght@600&display=swap" rel="stylesheet">
    <style>
        /* 画面レイアウト：左に設定、右にプレビュー */
        body { font-family: 'Noto Sans JP', sans-serif; background: #f0f2f5; margin: 0; display: flex; height: 100vh; overflow: hidden; }
        
        /* 左側：設定パネル */
        .editor-panel { width: 420px; background: white; padding: 25px; overflow-y: auto; border-right: 2px solid #ddd; box-shadow: 2px 0 10px rgba(0,0,0,0.1); z-index: 10; }
        .editor-panel h2 { font-size: 20px; color: #ff6b6b; margin-top: 0; border-bottom: 2px solid #ff6b6b; padding-bottom: 10px; margin-bottom: 20px; }
        .input-group { margin-bottom: 18px; }
        label { display: block; font-weight: bold; font-size: 12px; color: #555; margin-bottom: 6px; }
        input, select { width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 6px; font-size: 14px; margin-bottom: 5px; }
        .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
        
        .print-btn { background: #ff6b6b; color: white; border: none; padding: 18px; border-radius: 10px; cursor: pointer; font-size: 20px; width: 100%; font-weight: bold; margin-top: 25px; box-shadow: 0 4px 0 #ee5253; transition: 0.2s; }
        .print-btn:hover { background: #ee5253; transform: translateY(-2px); }

        /* 右側：プレビューエリア */
        .preview-area { flex-grow: 1; padding: 40px; overflow-y: auto; display: flex; justify-content: center; background: #525659; }
        
        /* A4チャート（印刷対象） */
        #printable-chart { 
            width: 210mm; min-height: 297mm; padding: 15mm; 
            background: white; box-shadow: 0 0 30px rgba(0,0,0,0.5);
            display: flex; flex-direction: column; box-sizing: border-box;
        }

        /* デザイン設定 */
        .chart-header { text-align: center; border: 3px solid #333; padding: 18px; margin-bottom: 25px; border-radius: 12px; }
        .section-title { background: #333; color: white; padding: 5px 15px; display: inline-block; margin-bottom: 12px; font-size: 14px; font-weight: bold; border-radius: 4px; }
        table { width: 100%; border-collapse: collapse; margin-bottom: 20px; }
        th, td { border: 2.5px solid #333; padding: 10px; text-align: left; font-size: 13px; }
        .tracker td { text-align: center; font-size: 20px; height: 45px; }
        .flex-row { display: grid; grid-template-columns: 1.3fr 1fr; gap: 25px; margin-bottom: 25px; }
        
        .reflection-area { margin-top: auto; padding-top: 25px; border-top: 3px solid #333; }
        .box-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-bottom: 25px; }
        .comment-box { border: 2.5px solid #333; height: 150px; border-radius: 10px; position: relative; padding: 15px; }
        .box-label { position: absolute; top: -14px; left: 15px; background: white; padding: 0 10px; font-weight: bold; font-size: 14px; }

        .quote-box { text-align: center; font-style: italic; border-top: 1px dashed #ccc; padding-top: 20px; color: #555; font-size: 13px; min-height: 45px; }

        @media print {
            body { background: white; overflow: visible; }
            .editor-panel { display: none !important; }
            .preview-area { padding: 0; background: none; overflow: visible; }
            #printable-chart { box-shadow: none; border: none; margin: 0; width: 210mm; height: 297mm; }
        }
    </style>
</head>
<body>

<div class="editor-panel">
    <h2>🛠 Chart Editor Pro</h2>
    
    <div class="input-group">
        <label>お子さんの名前 / 絵文字</label>
        <div class="grid-2">
            <input type="text" id="in-name" value="Emma">
            <input type="text" id="in-emoji" value="❄️">
        </div>
    </div>

    <div class="input-group">
        <label>カラー / 書体</label>
        <div class="grid-2">
            <input type="color" id="in-color" value="#ffeaa7">
            <select id="in-font">
                <option value="'Noto Sans JP'">Standard</option>
                <option
