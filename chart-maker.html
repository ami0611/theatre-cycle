<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>Family Passion Chart - Ultimate Connect</title>
    <link href="https://fonts.googleapis.com/css2?family=Kiwi+Maru&family=Noto+Sans+JP:wght@400;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Noto Sans JP', sans-serif; background: #f0f2f5; margin: 0; display: flex; height: 100vh; overflow: hidden; }
        .editor { width: 380px; background: white; padding: 25px; overflow-y: auto; border-right: 2px solid #ddd; flex-shrink: 0; box-shadow: 2px 0 10px rgba(0,0,0,0.1); }
        .preview { flex-grow: 1; padding: 20px; overflow-y: auto; background: #525659; display: flex; justify-content: center; }
        
        h2 { font-size: 18px; color: #ff6b6b; border-bottom: 2px solid #ff6b6b; padding-bottom: 8px; margin-top: 0; }
        label { display: block; font-weight: bold; font-size: 11px; color: #666; margin-top: 12px; }
        input { width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 6px; font-size: 14px; margin-top: 4px; box-sizing: border-box; }
        .grid-3 { display: grid; grid-template-columns: 2fr 1fr 1fr; gap: 5px; }
        .btn { background: #ff6b6b; color: white; border: none; padding: 18px; width: 100%; border-radius: 10px; cursor: pointer; font-size: 18px; font-weight: bold; margin-top: 25px; box-shadow: 0 4px 0 #ee5253; }

        #chart { width: 210mm; min-height: 297mm; padding: 15mm; background: white; box-sizing: border-box; display: flex; flex-direction: column; box-shadow: 0 0 20px rgba(0,0,0,0.5); }
        .header { text-align: center; border: 3px solid #333; padding: 15px; margin-bottom: 20px; border-radius: 12px; }
        .section-title { background: #333; color: white; padding: 4px 12px; font-size: 13px; font-weight: bold; margin-bottom: 10px; display: inline-block; border-radius: 4px; }
        
        table { width: 100%; border-collapse: collapse; margin-bottom: 20px; }
        th, td { border: 2.5px solid #333; padding: 10px; font-size: 12px; text-align: left; }
        .tracker td { text-align: center; height: 40px; }
        .tracker input[type="checkbox"] { transform: scale(1.5); cursor: pointer; }
        
        .flex-row { display: grid; grid-template-columns: 1.3fr 1fr; gap: 20px; margin-bottom: 20px; }
        .sanctuary-box { background: #fff9e6; border: 2.5px solid #333; padding: 12px; font-size: 12px; margin-top: 5px; }

        .summary { background: #f0f9ff; border: 2.5px solid #0077cc; padding: 18px; border-radius: 12px; margin-top: 15px; display: flex; justify-content: space-around; text-align: center; }
        .val-text { font-size: 26px; font-weight: bold; color: #0077cc; }
        .blank-text { display: none; font-size: 24px; font-weight: bold; letter-spacing: 2px; }

        .footer { margin-top: auto; border-top: 3px solid #333; padding-top: 20px; }
        .box-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-bottom: 20px; }
        .reflect-box { border: 2.5px solid #333; height: 140px; border-radius: 10px; position: relative; padding: 15px; }
        .box-l { position: absolute; top: -14px; left: 15px; background: white; padding: 0 10px; font-weight: bold; font-size: 14px; }

        @media print {
            .editor { display: none !important; }
            .preview { background: none !important; padding: 0 !important; overflow: visible !important; }
            #chart { border: none !important; box-shadow: none !important; margin: 0 !important; width: 210mm; height: 297mm; }
            .tracker input[type="checkbox"] { appearance: none !important; -webkit-appearance: none !important; border: 2.5px solid #333 !important; width: 20px !important; height: 20px !important; background: white !important; }
            .val-text { display: none !important; }
            .blank-text { display: inline-block !important; }
            .summary { border-color: #333 !important; background: white !important; }
        }
    </style>
</head>
<body>

<div class="editor">
    <h2>🛠
